services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: aegischain_db
    profiles: ["core", "mlops", "obs"]
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-aegischain_db}
      POSTGRES_USER: ${POSTGRES_USER:-aegis_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-aegis_user} -d ${POSTGRES_DB:-aegischain_db}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - aegischain_network

  erp:
    build:
      context: ./erp_core
      dockerfile: ../docker/Dockerfile.erp
    container_name: aegischain_erp
    profiles: ["core"]
    env_file:
      - .env
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB:-aegischain_db}
      DB_USER: ${POSTGRES_USER:-aegis_user}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/')"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - aegischain_network

  ai:
    build:
      context: ./aegis_ai
      dockerfile: ../docker/Dockerfile.ai
    container_name: aegischain_ai
    profiles: ["core"]
    env_file:
      - .env
    environment:
      ERP_API_URL: http://erp:8000/api
    ports:
      - "8001:8001"
    depends_on:
      erp:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - aegischain_network

  ai_worker:
    build:
      context: ./aegis_ai
      dockerfile: ../docker/Dockerfile.ai
    container_name: aegischain_ai_worker
    profiles: ["core"]
    command: ["python", "-m", "events.worker"]
    env_file:
      - .env
    environment:
      ERP_API_URL: http://erp:8000/api
      DATABASE_URL: "host=postgres port=5432 dbname=${POSTGRES_DB:-aegischain_db} user=${POSTGRES_USER:-aegis_user} password=${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}"
    ports:
      - "8002:8002"
    depends_on:
      postgres:
        condition: service_healthy
      erp:
        condition: service_healthy
    networks:
      - aegischain_network

networks:
  aegischain_network:
    driver: bridge

volumes:
  postgres_data:
