[project]
name = "erp-core"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "django>=6.1.3",
    "django-cors-headers>=4.9.0",
    "django-filter>=26.2",
    "django-unfold>=0.110.1",
    "djangorestframework>=3.18.3",
    "drf-spectacular>=0.30.0",
    "gunicorn>=27.0.1",
    "pgvector>=0.5.1",
    "pillow>=13.0.0",
    "psycopg[binary]>=3.3.9",
    "pypdf>=7.1.1",
    "python-dotenv>=1.2.4",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "pytest-django>=4.14.0",
    "ruff>=0.17.5",
]
