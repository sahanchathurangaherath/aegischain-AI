[project]
name = "ml"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.165.0",
    "lightgbm>=4.7.0",
    "numpy>=2.5.5",
    "pandera[polars]>=0.36.0",
    "polars>=2.1.0",
    "prometheus-client>=0.26.0",
    "pydantic>=2.14.4",
    "scikit-learn>=1.9.1",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
    "ruff>=0.17.6",
]


[tool.pytest.ini_options]
pythonpath = ["."]
